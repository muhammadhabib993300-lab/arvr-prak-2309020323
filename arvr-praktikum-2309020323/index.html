<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Praktikum 1 - Scene Pertama</title>
 <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
 <a-scene>
 <a-box position="1 0.5 -3" rotation="0 45 0" color="#39ff14" width="1.2" height="1" depth="1.2"
 animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-box>
 <a-sphere position="0 1.25 -5" radius="1.25" color="#000000"></a-sphere>
 <a-cylinder position="1 1.75 -3" radius="0.5" height="1.5"
 color="#ECECEC"></a-cylinder>
 <a-torus position="0 4 -5" rotation="0 45 0" color="#39ff14"
 animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"></a-torus>
 <a-cone position="1 3.1 -3" rotation="0 45 0" color="#39ff14"></a-cone>
 <a-plane position="0 0 -4" rotation="-90 0 0" width="6" height="6"
 color="#ececec"></a-plane>
 <a-sky color="#00c863"></a-sky>
 <a-text
value="Muhammad Habib Rizky - 2309020323" position="0 0.6 -2" align="center" color="#222222"
width="6"></a-text>
 </a-scene>
</body>
</html>
