<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Praktikum 1 - Scene Pertama</title>
 <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
 <a-scene fog="type: exponential; color: #000010; density: 0.08">
 
    #Saturn
 <a-entity position="0 1.6 0" animation="property: rotation; to: 0 360; loop: true; dur: 20000; easing: linear">
    <a-entity rotation="20 0 20">
        <a-sphere position="0 0 -4" radius="0.9" color="#e8a05a"></a-sphere>
        <a-ring position="0 0 -4" rotation="-90 0 0" radius-inner="1.2" radius-outer="2" 
            material="color: #f2d49b; side: double; opacity: 0.8; transparent: true"></a-ring>
    </a-entity>
 </a-entity>

    #Anak bulan
 <a-entity position="0 .18 -4" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
    <a-sphere position="0 .50 2" radius="0.38" color="#c9c9d6"></a-sphere>
 </a-entity>
 
    #Satelit
 <a-entity position="-3 1.5 -3" 
    animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
    <a-box depth="0.5" height="0.05" width="0.5" material="color: #cfd8dc; metalness: 0.6; roughness: 0.3"></a-box>
        <a-box position="0.7 0 0" depth="0.4" height="0.05" width="0.8" color="#2e5cff"></a-box>
        <a-box position="-0.7 0 0" depth="0.4" height="0.05" width="0.8" color="#2e5cff"></a-box>
 </a-entity>

    #Roket NASA
 <a-entity position="3 1 -3" 
    animation="property: position; to: 3 1.4 -3; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
        <a-cylinder radius="0.25" height="1" color="#f5f5f5"></a-cylinder>
        <a-cone position="0 0.75 0" radius-bottom="0.25" radius-top="0" height="0.5" color="#ff5a5f"></a-cone>
      <a-box position="0.3 -0.4 0" width="0.25" height="0.3" depth="0.05" color="#ff5a5f"></a-box>
      <a-box position="-0.3 -0.4 0" width="0.25" height="0.3" depth="0.05" color="#ff5a5f"></a-box>
 </a-entity>

    #Angkasa(Eceknya)
 <a-light type="ambient" color="#2a2f5a" intensity="0.5"></a-light>
 <a-light type="directional" color="#fff4d6" intensity="1.2" position="5 6 2"></a-light>
 <a-light type="point" color="#6ea8ff" intensity="0.6" position="-4 2 -3"></a-light>    

    #Backround dan lantai
 <a-sky color="#000010"></a-sky>
 <a-plane position="0 0 -4" rotation="-90 0 0" width="14" height="14"
 color="#14142b"></a-plane>

    #Bintang
    <a-entity id="bintang"></a-entity>

    #Camera
    <a-entity position="0 1.6 0">
        <camera></camera>
    </a-entity>

    #Pencipta semesta kecil-kecilan dulu ya
    <a-text value="Muhammad Habib Rizky - 2309020323" position="0 4 -4" align="center" color="#ffffff" width="8"></a-text>
    <a-text value="Penjelajah Dunia Virtual" position="0 3.5 -4" align="center" color="#ffd166" width="5"></a-text>

<script>
    const wadah = document.querySelector('#bintang');
    const R = 35;
    for (let i = 0; i < 200; i++) {
      const azimut = Math.random() * Math.PI * 2;
      const elevasi = Math.random() * Math.PI / 2.2;
      const x = R * Math.cos(elevasi) * Math.cos(azimut);
      const y = R * Math.sin(elevasi);
      const z = R * Math.cos(elevasi) * Math.sin(azimut);
      const bintang = document.createElement('a-sphere');
      bintang.setAttribute('position', `${x} ${y} ${z}`);
      bintang.setAttribute('radius', 0.08 + Math.random() * 0.1);
      bintang.setAttribute('material', 'shader: flat; color: #ffffff; fog: false');
      wadah.appendChild(bintang);
    }
  </script>

 </a-scene>
</body>
</html>
